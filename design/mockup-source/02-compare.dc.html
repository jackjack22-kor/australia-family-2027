<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A+ 여행안 비교</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';src:url(/_blob/0ca66a1409617c5a8496d9cee2c89379) format('woff2');font-weight:45 920;font-display:swap}
body{margin:0}
a{color:#0E3B54}a:hover{color:#0A2A3C}
</style>
</helmet>
<div style="width: 390px; height: 1460px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F7; color: #0F2533; font-family: 'Pretendard', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 8px 20px; height: 60px; border-bottom: 1px solid #E3E8EC">
    <span style="font-size: 20px; font-weight: 800">여행안 비교</span>
    <span style="background: #FFE6DA; color: #A63B12; font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px">결정 D-10</span>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="text-align: left; border: 2px solid #0E3B54; background: #FFFFFF; border-radius: 20px; padding: 16px; font: inherit; color: #0F2533">
        <span style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 20px; font-weight: 800">1안</span>
          <span style="background: #0E3B54; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">선택됨</span>
        </span>
        <span style="display: block; font-size: 15px; font-weight: 700; margin-top: 8px">1/31(일) 출발</span>
        <span style="display: block; font-size: 14px; color: #5B6670; margin-top: 2px">호주 13박 · 직항</span>
      </button>
      <button style="text-align: left; border: 1px solid #DDE3E8; background: #FFFFFF; border-radius: 20px; padding: 17px; font: inherit; color: #0F2533">
        <span style="display: block; font-size: 20px; font-weight: 800">2안</span>
        <span style="display: block; font-size: 15px; font-weight: 700; margin-top: 8px">2/6(토) 출발</span>
        <span style="display: block; font-size: 14px; color: #5B6670; margin-top: 2px">호주 11박 · 싱가포르 경유</span>
      </button>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 18px 16px">
      <h2 style="margin: 0 0 14px; font-size: 17px; font-weight: 700">날짜로 보기</h2>
      <div style="position: relative; height: 20px; margin-left: 40px">
        <sc-for list="{{ axis }}" as="a" hint-placeholder-count="4">
          <span style="position: absolute; top: 0; left: {{ a.left }}; font-size: 12px; font-weight: {{ a.weight }}; color: {{ a.color }}; white-space: nowrap">{{ a.label }}</span>
        </sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; height: 40px; position: relative">
          <span style="width: 40px; font-size: 14px; font-weight: 800">{{ r.name }}</span>
          <div style="flex: 1; display: grid; grid-template-columns: repeat(19, minmax(0, 1fr)); gap: 1px; height: 24px">
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="19">
              <span style="background: {{ c.bg }}; border-radius: {{ c.radius }}"></span>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: #4A5B66">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0E5A7E"></span>시드니</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E0A526"></span>골드코스트</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #7A5BA6"></span>브리즈번</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #B7C3CB"></span>기내·이동</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 6px 16px">
      <sc-for list="{{ table }}" as="t" hint-placeholder-count="5">
        <div style="padding: 12px 0; border-bottom: {{ t.border }}">
          <div style="font-size: 13px; font-weight: 600; color: #5B6670">{{ t.label }}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px">
            <div>
              <div style="font-size: 15px; font-weight: 700">{{ t.a }}</div>
              <sc-if value="{{ t.aTag }}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-block; margin-top: 4px; background: {{ t.aBg }}; color: {{ t.aFg }}; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">{{ t.aTag }}</span>
              </sc-if>
            </div>
            <div>
              <div style="font-size: 15px; font-weight: 700">{{ t.b }}</div>
              <sc-if value="{{ t.bTag }}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-block; margin-top: 4px; background: {{ t.bBg }}; color: {{ t.bFg }}; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">{{ t.bTag }}</span>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-for>
    </section>

    <div style="background: #E6EEF3; border-radius: 16px; padding: 16px; font-size: 15px; line-height: 1.55">
      <strong>2안 출국편이 4인 합계 약 159만원 이하라면</strong> 비용은 2안이 유리합니다. 출국편 요금을 입력하면 바로 다시 계산됩니다.
    </div>

    <section>
      <h2 style="margin: 4px 0 10px; font-size: 17px; font-weight: 700">귀국 도시</h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 2px solid #0E3B54; border-radius: 20px; padding: 16px">
          <input type="radio" name="ret" checked style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #0E3B54">
          <span>
            <span style="display: block; font-size: 16px; font-weight: 800">브리즈번에서 직항</span>
            <span style="display: block; font-size: 14px; color: #4A5B66; margin-top: 4px">KE408 08:40 → 인천 18:05 · 전날 공항 호텔 1박</span>
          </span>
        </label>
        <label style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #DDE3E8; border-radius: 20px; padding: 17px">
          <input type="radio" name="ret" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #0E3B54">
          <span>
            <span style="display: block; font-size: 16px; font-weight: 800">시드니에서 귀국</span>
            <span style="display: block; font-size: 14px; color: #4A5B66; margin-top: 4px">국내선 + 시드니 1박 · 귀국편 요금 미정</span>
          </span>
        </label>
      </div>
    </section>

    <a href="#" style="height: 52px; border-radius: 14px; background: #0E3B54; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">1안 · 브리즈번 귀국으로 보기</a>
  </div>

  <div style="flex-grow: 1"></div>

  <nav aria-label="주요 메뉴" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E8EC; padding: 6px 4px 22px">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
      <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: {{ tab.weight }}; color: {{ tab.color }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ tab.icon }}"></path></svg>
        <span>{{ tab.label }}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1460}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { s: '#0E5A7E', g: '#E0A526', b: '#7A5BA6', t: '#B7C3CB', e: '#F0F3F5' };
    const N = 19;
    const mk = (spec) => {
      const cells = [];
      for (let i = 0; i < N; i++) cells.push({ bg: C.e, radius: '3px' });
      spec.forEach(([from, to, k]) => { for (let i = from; i <= to; i++) cells[i] = { bg: C[k], radius: '3px' }; });
      return cells;
    };
    const rows = [
      { name: '1안', cells: mk([[0, 0, 't'], [1, 7, 's'], [8, 12, 'g'], [13, 13, 'b'], [14, 14, 't']]) },
      { name: '2안', cells: mk([[6, 6, 't'], [7, 12, 's'], [13, 16, 'g'], [17, 17, 'b'], [18, 18, 't']]) }
    ];
    const pct = (i) => (i / N * 100).toFixed(2) + '%';
    const axis = [
      { label: '1/31', left: pct(0), weight: 600, color: '#5B6670' },
      { label: '2/6 설날', left: pct(6), weight: 800, color: '#A63B12' },
      { label: '2/14', left: pct(14), weight: 600, color: '#5B6670' },
      { label: '2/18', left: 'calc(' + pct(18) + ' - 8px)', weight: 600, color: '#5B6670' }
    ];
    const tag = (txt, kind) => {
      const m = { ok: ['#D7F2E1', '#11643A'], act: ['#FFE6DA', '#A63B12'], open: ['#EEF2F5', '#3E4E59'] }[kind];
      return { t: txt, bg: m[0], fg: m[1] };
    };
    const row = (label, a, at, b, bt) => ({
      label, a, b,
      aTag: at ? at.t : '', aBg: at ? at.bg : '', aFg: at ? at.fg : '',
      bTag: bt ? bt.t : '', bBg: bt ? bt.bg : '', bFg: bt ? bt.fg : '',
      border: '1px solid #E8ECEF'
    });
    const table = [
      row('출국편', 'OZ601 직항', tag('확정', 'ok'), '싱가포르 경유', tag('요금 미정', 'open')),
      row('귀국편', 'KE408 2/14(일)', tag('날짜 변경 필요', 'act'), 'KE408 2/18(목)', tag('확정', 'ok')),
      row('설날 2/6', '시드니에서 보냄', null, '출국하는 날', null),
      row('알려진 비용', '약 743만원', null, '출국편 입력 후 비교', null),
      row('결정에 남은 것', '귀국 좌석·수수료', null, '출국편 4인 요금', null)
    ];
    table[table.length - 1].border = '0';
    const icons = {
      home: 'M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      compare: 'M4 5h6v14H4zM14 5h6v14h-6z',
      day: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      ticket: 'M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H3zM14 6v12',
      check: 'M4 4h16v16H4zM8 12l3 3 5-6'
    };
    const tabs = [['home','홈'],['compare','비교'],['day','일정'],['ticket','예약'],['check','준비']].map(([k, label], i) => ({
      label, icon: icons[k], color: i === 1 ? '#0E3B54' : '#5B6670', weight: i === 1 ? 700 : 500
    }));
    return { rows, axis, table, tabs };
  }
}
</script>
</body>
</html>
