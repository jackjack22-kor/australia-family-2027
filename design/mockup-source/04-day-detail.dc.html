<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A+ 하루 일정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';src:url(/_blob/0ca66a1409617c5a8496d9cee2c89379) format('woff2');font-weight:45 920;font-display:swap}
body{margin:0}
a{color:#0E3B54}a:hover{color:#0A2A3C}
</style>
</helmet>
<div style="width: 390px; height: 1640px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F7; color: #0F2533; font-family: 'Pretendard', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="background: #FFFFFF; padding: 8px 12px 0">
    <div style="display: flex; align-items: center; gap: 4px; height: 56px">
      <button aria-label="전체 일정으로" style="width: 44px; height: 44px; border: 0; background: transparent; color: #0F2533; display: flex; align-items: center; justify-content: center; border-radius: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </button>
      <div style="flex: 1">
        <div style="font-size: 17px; font-weight: 700">2월 2일 화요일</div>
        <div style="font-size: 13px; color: #5B6670">1안 · 시드니 2일째</div>
      </div>
      <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #EEF2F5; color: #0F2533; font: inherit; font-size: 14px; font-weight: 700">오늘로</button>
    </div>
    <div style="display: flex; gap: 8px; padding: 8px 4px 14px; overflow: hidden">
      <sc-for list="{{ dates }}" as="d" hint-placeholder-count="7">
        <button style="flex: 0 0 48px; height: 68px; border-radius: 14px; border: 1px solid {{ d.border }}; background: {{ d.bg }}; color: {{ d.fg }}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: 12px; font-weight: 600">{{ d.wd }}</span>
          <span style="font-size: 18px; font-weight: 800">{{ d.n }}</span>
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{ d.dot }}"></span>
        </button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <section style="background: #FFFFFF; border-radius: 20px; padding: 20px">
      <span style="display: inline-block; background: #DCEDF5; color: #0B4A68; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px">시드니</span>
      <h1 style="margin: 10px 0 4px; font-size: 25px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em">타롱가 동물원과 더 록스</h1>
      <p style="margin: 0; font-size: 15px; color: #5B6670">페리 타고 동물원으로</p>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
        <div style="background: #F3F5F7; border-radius: 14px; padding: 10px 12px"><div style="font-size: 12px; color: #5B6670">방문</div><div style="font-size: 16px; font-weight: 800">3곳</div></div>
        <div style="background: #F3F5F7; border-radius: 14px; padding: 10px 12px"><div style="font-size: 12px; color: #5B6670">이동</div><div style="font-size: 16px; font-weight: 800">페리</div></div>
        <div style="background: #F3F5F7; border-radius: 14px; padding: 10px 12px"><div style="font-size: 12px; color: #5B6670">숙소</div><div style="font-size: 16px; font-weight: 800">풀만</div></div>
      </div>
    </section>

    <div style="height: 200px; border-radius: 20px; overflow: hidden; position: relative; background: #E9EEE6">
      <svg viewBox="0 0 358 200" width="358" height="200" style="position: absolute; inset: 0" aria-hidden="true">
        <path d="M0 92 C60 70 110 104 170 96 S290 70 358 84 L358 132 C300 118 250 142 190 136 S70 150 0 128 Z" fill="#CFE3EC"></path>
        <path d="M150 128 C160 150 168 168 160 200 L196 200 C198 170 196 150 186 134 Z" fill="#E9EEE6"></path>
        <path d="M40 60h80M60 30v60M220 40h90M250 20v60M40 170h90M230 165h110" stroke="#D9E0D4" stroke-width="6" stroke-linecap="round"></path>
      </svg>
      <div style="position: absolute; left: 172px; top: 120px; border-top: 2.5px dashed #0E3B54; width: 108px; transform: rotate(-25deg); transform-origin: left center"></div>
      <span style="position: absolute; left: 158px; top: 138px; width: 30px; height: 30px; border-radius: 50%; background: #0E3B54; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF">1</span>
      <span style="position: absolute; left: 262px; top: 52px; width: 30px; height: 30px; border-radius: 50%; background: #0E3B54; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF">2</span>
      <span style="position: absolute; left: 94px; top: 148px; width: 30px; height: 30px; border-radius: 50%; background: #0E3B54; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF">3</span>
      <span style="position: absolute; left: 190px; top: 166px; width: 30px; height: 30px; border-radius: 9px; background: #E0A526; color: #3B2A00; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"></path></svg>
      </span>
      <a href="#" style="position: absolute; right: 10px; top: 10px; height: 44px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; color: #0F2533; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">지도 크게 보기</a>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{ stops }}" as="s" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: flex-start">
          <span style="position: relative; width: 44px; height: 44px; border-radius: 14px; background: {{ s.tileBg }}; color: {{ s.tileFg }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.icon }}"></path></svg>
            <span style="position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: #0E3B54; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">{{ s.n }}</span>
          </span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 13px; font-weight: 700; color: #0E5A7E">{{ s.slot }}</div>
            <div style="font-size: 17px; font-weight: 800; margin-top: 2px">{{ s.name }}</div>
            <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: #4A5B66">{{ s.tip }}</p>
            <sc-if value="{{ s.food }}" hint-placeholder-val="{{ false }}">
              <a href="#" style="margin-top: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px dashed #9AA8B2; color: #0F2533; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">+ 식당 후보 추가</a>
            </sc-if>
          </div>
          <a href="#" aria-label="{{ s.navLabel }}" style="width: 44px; height: 44px; border-radius: 50%; background: #EEF2F5; color: #0F2533; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"></path></svg>
          </a>
        </div>
        <sc-if value="{{ s.move }}" hint-placeholder-val="{{ true }}">
          <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding-left: 37px; position: relative">
            <div style="position: absolute; left: 37px; top: 0; bottom: 0; border-left: 2px dashed #B7C3CB"></div>
            <span style="margin-left: 14px; background: #FFFFFF; border: 1px solid #DDE3E8; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: #3E4E59">{{ s.move }}</span>
          </div>
        </sc-if>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 20px">
      <div style="display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #FBEFD0; color: #7A5600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"></path></svg>
        </span>
        <div style="flex: 1">
          <div style="font-size: 13px; color: #5B6670; font-weight: 600">오늘 밤 · 3박 중 둘째 밤</div>
          <div style="font-size: 17px; font-weight: 800">풀만 키그랜드 시드니 하버</div>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px">
        <span style="background: #EEF2F5; color: #3E4E59; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px">미예약</span>
        <span style="background: #EEF2F5; color: #3E4E59; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px">스테이플러스</span>
        <span style="background: #EEF2F5; color: #3E4E59; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px">성인 3 · 아동 1</span>
      </div>
      <a href="#" style="margin-top: 12px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E8ECEF; padding-top: 6px; color: #0F2533; font-size: 15px; font-weight: 600; text-decoration: none">
        <span>확인할 것 · 4인 등록과 조식 운영</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
      <a href="#" style="margin-top: 8px; height: 52px; border-radius: 14px; background: #E6EEF3; color: #0E3B54; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">예약 정보 입력</a>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 20px">
      <label for="memoF" style="font-size: 17px; font-weight: 800">이날의 메모</label>
      <textarea id="memoF" placeholder="예약 시간, 식당, 이동 팁" style="margin-top: 10px; width: 100%; box-sizing: border-box; height: 88px; border: 0; border-radius: 14px; background: #F3F5F7; padding: 12px 14px; font: inherit; font-size: 15px; color: #0F2533; resize: none"></textarea>
    </section>
  </div>

  <div style="flex-grow: 1"></div>

  <nav aria-label="주요 메뉴" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E8EC; padding: 6px 4px 22px">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
      <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: {{ tab.weight }}; color: {{ tab.color }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ tab.icon }}"></path></svg>
        <span>{{ tab.label }}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = '#0E3B54';
    const city = { s: '#0E5A7E', f: '#9AA8B2' };
    const raw = [['일','31','f'],['월','1','s'],['화','2','s'],['수','3','s'],['목','4','s'],['금','5','s'],['토','6','s']];
    const dates = raw.map(([wd, n, c], i) => {
      const sel = i === 2;
      return { wd, n, dot: sel ? '#FFFFFF' : city[c], bg: sel ? primary : '#FFFFFF', fg: sel ? '#FFFFFF' : '#0F2533', border: sel ? primary : '#DDE3E8' };
    });
    const icons = {
      home: 'M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      compare: 'M4 5h6v14H4zM14 5h6v14h-6z',
      day: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      ticket: 'M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H3zM14 6v12',
      check: 'M4 4h16v16H4zM8 12l3 3 5-6',
      ferry: 'M4 15h16l-3 5H7zM7 15V9h10v6M10 9V5h4v4',
      paw: 'M12 20c-3 0-5-2-5-4s2-4 5-4 5 2 5 4-2 4-5 4zM6 10a2 2 0 1 0 0-.1M18 10a2 2 0 1 0 0-.1M9 6a2 2 0 1 0 0-.1M15 6a2 2 0 1 0 0-.1',
      fork: 'M7 3v8a2 2 0 0 0 4 0V3M9 3v18M17 3c-2 2-2 6 0 8v10'
    };
    const tabs = [['home','홈'],['compare','비교'],['day','일정'],['ticket','예약'],['check','준비']].map(([k, label], i) => ({
      label, icon: icons[k], color: i === 2 ? primary : '#5B6670', weight: i === 2 ? 700 : 500
    }));
    return {
      dates, tabs,
      stops: [
        { n: 1, slot: '오전', name: '써큘러키', tip: '타롱가행 페리 부두. 출발 전 운항 시간표 확인.', move: '페리 약 12분', food: false, icon: icons.ferry, tileBg: '#DCEDF5', tileFg: '#0B4A68', navLabel: '써큘러키 길찾기' },
        { n: 2, slot: '낮', name: '타롱가 동물원', tip: '하루 중 가장 긴 일정. 한낮 햇볕 대비 물과 모자.', move: '페리 복귀 후 도보', food: false, icon: icons.paw, tileBg: '#E1F5E8', tileFg: '#187245', navLabel: '타롱가 동물원 길찾기' },
        { n: 3, slot: '저녁', name: '더 록스', tip: '돌길 골목을 걷고 저녁 식사로 마무리.', move: '', food: true, icon: icons.fork, tileBg: '#FBEFD0', tileFg: '#7A5600', navLabel: '더 록스 길찾기' }
      ]
    };
  }
}
</script>
</body>
</html>
