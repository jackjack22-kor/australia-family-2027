<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A+ 전체 일정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';src:url(/_blob/0ca66a1409617c5a8496d9cee2c89379) format('woff2');font-weight:45 920;font-display:swap}
body{margin:0}
a{color:#0E3B54}a:hover{color:#0A2A3C}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F7; color: #0F2533; font-family: 'Pretendard', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="background: #FFFFFF; padding: 8px 16px 12px 20px; border-bottom: 1px solid #E3E8EC">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
      <span style="font-size: 20px; font-weight: 800">전체 일정</span>
      <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #EEF2F5; color: #0F2533; font: inherit; font-size: 14px; font-weight: 700">1안 · 브리즈번 ▾</button>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 4px; overflow: hidden">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button style="height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid {{ f.border }}; background: {{ f.bg }}; color: {{ f.fg }}; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ f.dot }}"></span>{{ f.label }}
        </button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 8px 16px 16px; display: flex; flex-direction: column">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
      <sc-if value="{{ it.group }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 18px 4px 10px">
          <span style="width: 12px; height: 12px; border-radius: 4px; background: {{ it.gColor }}"></span>
          <span style="font-size: 17px; font-weight: 800">{{ it.group }}</span>
          <span style="font-size: 14px; color: #5B6670">{{ it.gMeta }}</span>
        </div>
      </sc-if>
      <a href="#" style="display: flex; gap: 14px; align-items: center; background: #FFFFFF; border-radius: 18px; padding: 14px 14px 14px 12px; margin-bottom: 8px; text-decoration: none; color: #0F2533">
        <span style="width: 48px; flex-shrink: 0; text-align: center">
          <span style="display: block; font-size: 12px; font-weight: 600; color: #5B6670">{{ it.m }}</span>
          <span style="display: block; font-size: 22px; font-weight: 800; line-height: 1.15; color: {{ it.dColor }}">{{ it.d }}</span>
          <span style="display: block; font-size: 12px; font-weight: 600; color: {{ it.wColor }}">{{ it.w }}</span>
        </span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 700; line-height: 1.35">{{ it.title }}</span>
          <span style="display: block; font-size: 14px; color: #5B6670; margin-top: 2px">{{ it.sub }}</span>
          <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center">
            <span style="font-size: 13px; color: #3E4E59; display: flex; align-items: center; gap: 4px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.metaIcon }}"></path></svg>{{ it.stay }}
            </span>
            <sc-if value="{{ it.tag }}" hint-placeholder-val="{{ false }}">
              <span style="background: {{ it.tagBg }}; color: {{ it.tagFg }}; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">{{ it.tag }}</span>
            </sc-if>
          </span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A97A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <nav aria-label="주요 메뉴" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E8EC; padding: 6px 4px 22px">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
      <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: {{ tab.weight }}; color: {{ tab.color }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ tab.icon }}"></path></svg>
        <span>{{ tab.label }}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const city = { s: '#0E5A7E', g: '#B07A00', n: '#0F2533' };
    const bed = 'M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5';
    const plane = 'M2 16l20-6-20-6 4 6zM6 10h8';
    const T = {
      move: ['#FFE6DA', '#A63B12'], info: ['#EEF2F5', '#3E4E59'], ok: ['#D7F2E1', '#11643A'], holiday: ['#FFF0D1', '#7A5600']
    };
    const raw = [
      ['1월','31','일','n','인천 출발 · OZ601 20:00','출발하는 밤','기내 1박', plane,'출국 확정','ok', ['인천','출국','#B7C3CB']],
      ['2월','1','월','s','오페라하우스 · 보타닉가든','항구에서 여름을 시작합니다','풀만 키그랜드', bed,'','', ['시드니','2/1 – 2/8 · 7박','#0E5A7E']],
      ['2월','2','화','s','써큘러키 · 타롱가 · 더 록스','페리 타고 동물원으로','풀만 키그랜드', bed,'',''],
      ['2월','3','수','s','블루마운틴 · 페더데일','푸른 산으로 떠나는 하루','풀만 키그랜드', bed,'근교 투어','info'],
      ['2월','4','목','s','시라이프 수족관 · 해양박물관','달링하버로 동네를 옮깁니다','노보텔 달링하버', bed,'호텔 이동','move'],
      ['2월','5','금','s','본다이 해변 · 차이나타운','해변의 낮, 춘절의 저녁','노보텔 달링하버', bed,'설 전날','holiday'],
      ['2월','6','토','s','차이나타운 춘절 행사','설날을 항구의 불빛과 함께','소피텔 달링하버', bed,'설날 · 호텔 이동','holiday'],
      ['2월','7','일','s','QVB · 하버 크루즈','도시를 걷고 바다를 봅니다','소피텔 달링하버', bed,'',''],
      ['2월','8','월','g','국내선 이동 · JW 라군','라군이 기다리는 곳으로','JW 메리어트', bed,'국내선 미예약','move', ['골드코스트','2/8 – 2/13 · 5박','#E0A526']],
      ['2월','9','화','g','무비월드','영화 속 하루','JW 메리어트', bed,'','']
    ];
    const items = raw.map(r => ({
      m: r[0], d: r[1], w: r[2], dColor: city[r[3]], wColor: r[2] === '일' ? '#B3261E' : (r[2] === '토' ? '#1D5FB8' : '#5B6670'),
      title: r[4], sub: r[5], stay: r[6], metaIcon: r[7],
      tag: r[8], tagBg: r[9] ? T[r[9]][0] : '', tagFg: r[9] ? T[r[9]][1] : '',
      group: r[10] ? r[10][0] : '', gMeta: r[10] ? r[10][1] : '', gColor: r[10] ? r[10][2] : ''
    }));
    const filters = [['전체','#0F2533',true],['시드니','#0E5A7E',false],['골드코스트','#E0A526',false],['귀국','#7A5BA6',false]].map(([label, dot, on]) => ({
      label, dot: on ? '#FFFFFF' : dot, bg: on ? '#0E3B54' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F2533', border: on ? '#0E3B54' : '#DDE3E8'
    }));
    const icons = {
      home: 'M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      compare: 'M4 5h6v14H4zM14 5h6v14h-6z',
      day: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      ticket: 'M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H3zM14 6v12',
      check: 'M4 4h16v16H4zM8 12l3 3 5-6'
    };
    const tabs = [['home','홈'],['compare','비교'],['day','일정'],['ticket','예약'],['check','준비']].map(([k, label], i) => ({
      label, icon: icons[k], color: i === 2 ? '#0E3B54' : '#5B6670', weight: i === 2 ? 700 : 500
    }));
    return { items, filters, tabs };
  }
}
</script>
</body>
</html>
